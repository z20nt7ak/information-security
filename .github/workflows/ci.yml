name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres3
          POSTGRES_PASSWORD: "0000"
          POSTGRES_DB: lab_work_1
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres3 -d lab_work_1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/lab_work_1
          SPRING_DATASOURCE_USERNAME: postgres3
          SPRING_DATASOURCE_PASSWORD: "0000"
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: ./mvnw -B -ntp verify

      - name: SAST
        run: ./mvnw -B -ntp spotbugs:check

      - name: SCA
        if: ${{ !cancelled() }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp dependency-check:check

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          if-no-files-found: warn
          path: target/dependency-check-report.html